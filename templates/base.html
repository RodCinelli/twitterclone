{% load static %}
<!DOCTYPE html>
<html lang="pt-br" x-data="{ openMenu: false }">
<head>
    <!-- Bootstrap CDN + Alpine.js + HTMX -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{% static 'css/custom.css' %}">
</head>
<body class="bg-light">
    <!-- Exemplo de navbar com link de logout atualizado -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">TwitterClone</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'account_logout' %}">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Esquerda -->
            <nav class="col-md-2 d-none d-md-block bg-white sidebar">
                {% include 'includes/sidebar.html' %}
            </nav>

            <!-- Conteúdo Principal -->
            <main class="col-md-6 ms-sm-auto px-md-4">
                {% block content %}{% endblock %}
            </main>

            <!-- Sidebar Direita -->
            <aside class="col-md-4">
                {% include 'includes/right_sidebar.html' %}
            </aside>
        </div>
    </div>
</body>
</html>
