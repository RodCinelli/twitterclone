{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h2 class="auth-title">{% trans "Esqueceu sua senha?" %}</h2>
    <p class="text-center">{% trans "Insira seu endereço de e-mail para receber as instruções de redefinição da senha." %}</p>
    <form method="post" action="{% url 'account_reset_password' %}">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary btn-block">{% trans "Enviar instruções" %}</button>
    </form>
    <p class="text-center mt-3">
      <a href="{% url 'login' %}">{% trans "Voltar ao login" %}</a>
    </p>
  </div>
</div>
{% endblock %}
