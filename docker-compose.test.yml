services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - ./env.test
    depends_on:
      - db

  db:
    image: postgres:13.0-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=twitterclone_test
      - POSTGRES_PASSWORD=twitterclone_test
      - POSTGRES_DB=twitterclone_test_db

volumes:
  postgres_data:
  app_data: 